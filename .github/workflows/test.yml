name: API Automation Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# Add permissions for check runs
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Create .env file
      run: |
        echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
        echo "EMAIL=${{ secrets.EMAIL }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "COMPANY_ID=${{ secrets.COMPANY_ID }}" >> .env
        echo "DEBUG=true" >> .env

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_ENABLE_NOTIFICATIONS: 'true'
        TEST_ENVIRONMENT: 'CI/CD'
        GITHUB_ACTOR: ${{ github.actor }}
        REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "🔍 Checking Slack Configuration..."
        echo "✓ SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' && 'Configured' || 'NOT CONFIGURED' }}"
        echo "✓ SLACK_ENABLE_NOTIFICATIONS: $SLACK_ENABLE_NOTIFICATIONS"
        echo "✓ TEST_ENVIRONMENT: $TEST_ENVIRONMENT"
        echo "✓ GITHUB_ACTOR: $GITHUB_ACTOR"
        echo ""
        ./gradlew test --no-daemon
      continue-on-error: true

    - name: Upload Extent Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extent-report
        path: test-output/
        retention-days: 30
        
    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          build/test-results/**/*.xml
